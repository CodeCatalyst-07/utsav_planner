name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci-pipeline:
    name: Lint, Test, Typecheck, E2E & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Secret Scan with Gitleaks
        run: gitleaks detect --verbose

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Check
        run: pnpm lint

      - name: Prettier Format Check
        run: pnpm format

      - name: TypeScript Typecheck
        run: pnpm typecheck

      - name: Vitest Unit & Coverage Tests
        run: pnpm test:coverage

      - name: LLM Deterministic Evals
        run: pnpm eval

      - name: Production Dependency Security Audit
        run: pnpm audit --prod --audit-level=high || true

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright E2E & Axe Accessibility Tests
        run: pnpm test:e2e

      - name: Production Build
        run: pnpm build
